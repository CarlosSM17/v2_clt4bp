; PHP de CLT4BP en Railway (sobre php.ini-production)
expose_php = Off
memory_limit = 512M
; Medios de hasta 500 MB y PDF del material de hasta 50 MB (CLT4BP_MEDIOS_MAX_KB, CLT4BP_MATERIAL_MAX_KB)
upload_max_filesize = 520M
post_max_size = 530M
; Una consulta interactiva al agente local por el relevo espera hasta 90 s (trazas)
max_execution_time = 120

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
