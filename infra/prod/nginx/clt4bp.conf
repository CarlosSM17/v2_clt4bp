# /etc/nginx/sites-available/clt4bp — basado en el ejemplo de despliegue de Laravel.
# preparar-servidor.sh sustituye DOMINIO; certbot agrega después el bloque HTTPS y la redirección.
server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO;
    root /srv/clt4bp/current/apps/web/public;

    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 520m; # videos de hasta 500 MB (Etapa 3)

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Recursos compilados por Vite: llevan hash en el nombre, así que se guardan un año
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    # Instalador y actualizaciones de la consola (7.3); latest.yml no se guarda en caché
    location /descargas/consola/ {
        alias /srv/clt4bp/shared/descargas/consola/;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # ZAP 10021/10063: nginx sirve estos dos archivos directamente (sin pasar por PHP), así
    # que las cabeceras de App\Http\Middleware\CabecerasSeguridad no les aplican; se repiten aquí.
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
        add_header X-Content-Type-Options "nosniff" always;
    }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/clt4bp.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 32k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_read_timeout 120s;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
