; /etc/php/8.5/fpm/pool.d/clt4bp.conf — pool de PHP-FPM de la plataforma.
; Corre como deploy: la web, las colas y los despliegues escriben los mismos archivos sin pelear por permisos.
[clt4bp]
user = deploy
group = deploy
listen = /run/php/clt4bp.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Cada proceso usa ~60 MB: 20 caben de sobra en 8 GB junto con PostgreSQL
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 512M
php_admin_value[post_max_size] = 520M
php_admin_value[max_execution_time] = 120
php_admin_flag[log_errors] = on
