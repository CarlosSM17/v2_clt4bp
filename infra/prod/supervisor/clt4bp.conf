; /etc/supervisor/conf.d/clt4bp.conf — trabajadores de las colas de Laravel.
; stopwaitsecs es mayor que el trabajo más largo (300 s) y DB_QUEUE_RETRY_AFTER (360) mayor que ambos.

; Calificación de envíos y pruebas, análisis y avisos
[program:clt4bp-cola]
process_name=%(program_name)s_%(process_num)02d
command=php /srv/clt4bp/current/apps/web/artisan queue:work database --queue=default --sleep=3 --max-time=3600
directory=/srv/clt4bp/current/apps/web
user=deploy
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=330
redirect_stderr=true
stdout_logfile=/srv/clt4bp/shared/logs/cola.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

; Trabajos del agente: uno a la vez (cuestan dinero y tardan minutos)
[program:clt4bp-cola-agente]
process_name=%(program_name)s_%(process_num)02d
command=php /srv/clt4bp/current/apps/web/artisan queue:work database --queue=agente --sleep=3 --max-time=3600
directory=/srv/clt4bp/current/apps/web
user=deploy
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=330
redirect_stderr=true
stdout_logfile=/srv/clt4bp/shared/logs/cola-agente.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
