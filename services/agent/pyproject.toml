[project]
name = "clt4bp-agent"
version = "0.4.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "CarlosSM17", email = "samcdvg17@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.8.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.3",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "scipy>=1.16",
    "sentry-sdk[fastapi]>=2.70.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
